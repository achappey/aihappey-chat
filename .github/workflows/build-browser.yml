name: Build Browser Clients

on:
    push:
        branches: [main]

permissions:
    contents: write
    id-token: write

concurrency:
  group: browser-latest-build
  cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build all workspaces once
              run: npm run build

            - name: Prepare artifacts
              run: |
                  for sample in chathappey localhappey; do
                    test -s "samples/$sample/public/bundle.js"
                    test -f "samples/$sample/public/index.html"
                    mkdir -p "release/$sample"
                    cp -a "samples/$sample/public" "release/$sample/public"
                  done

            - name: Upload chathappey
              uses: actions/upload-artifact@v4
              with:
                  name: chathappey
                  path: release/chathappey/
                  if-no-files-found: error

            - name: Upload localhappey
              uses: actions/upload-artifact@v4
              with:
                  name: localhappey
                  path: release/localhappey/
                  if-no-files-found: error

            - name: Create release ZIPs
              run: |
                for sample in chathappey localhappey; do
                  (
                    cd "release/$sample"
                    zip -qr "../$sample.zip" public
                  )
                done

            - name: Publish latest build
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                if gh release view latest >/dev/null 2>&1; then
                  gh release delete latest --yes --cleanup-tag
                fi

                gh release create latest \
                  release/chathappey.zip \
                  release/localhappey.zip \
                  --title "Latest build" \
                  --notes "Build from commit ${GITHUB_SHA}" \
                  --target "$GITHUB_SHA" \
                  --latest

            - name: Azure Login (existing identity)
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy both websites
              env:
                CHAT_STORAGE: ${{ vars.AZURE_STORAGE_CHATHAPPEY }}
                LOCAL_STORAGE: ${{ vars.AZURE_STORAGE_LOCALHAPPEY }}
              run: |
                az storage blob upload-batch \
                  --account-name "$CHAT_STORAGE" \
                  --destination '$web' \
                  --source samples/chathappey/public \
                  --auth-mode login \
                  --overwrite true

                az storage blob upload-batch \
                  --account-name "$LOCAL_STORAGE" \
                  --destination '$web' \
                  --source samples/localhappey/public \
                  --auth-mode login \
                  --overwrite true

